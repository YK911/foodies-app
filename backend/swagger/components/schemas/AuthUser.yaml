type: object
required: [id, name, email, avatar]
properties:
  id:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000
  name:
    type: string
    example: Jane Doe
  email:
    type: string
    format: email
    example: jane@example.com
  avatar:
    type:
      - string
      - 'null'
    format: uri
    example: null

type: object
required:
  - id
  - title
  - categoryName
  - areaName
  - instructions
  - description
  - time
  - ownerId
  - createdAt
  - updatedAt
  - owner
  - category
  - area
  - ingredients
  - _count
properties:
  id:
    type: string
    example: 6462a8f74c3d0ddd28897fcd
  title:
    type: string
    example: Ocean Pasta
  categoryName:
    type: string
    example: Seafood
  areaName:
    type: string
    example: Italian
  instructions:
    type: string
    example: Bring a large saucepan of salted water to the boil and cook pasta.
  description:
    type: string
    example: A light seafood pasta with tomatoes and herbs.
  thumb:
    type: string
    nullable: true
    example: https://res.cloudinary.com/demo/image/upload/foodies/recipes/ocean-pasta.jpg
  time:
    type: string
    example: '27'
  ownerId:
    type: string
    example: 64c8d958249fae54bae90bb9
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  owner:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
      name:
        type: string
        example: Nadia
      avatar:
        type: string
        nullable: true
  category:
    $ref: '#/components/schemas/Category'
  area:
    $ref: '#/components/schemas/Area'
  ingredients:
    type: array
    items:
      type: object
      required:
        - id
        - recipeId
        - ingredientId
        - measure
        - ingredient
      properties:
        id:
          type: string
        recipeId:
          type: string
        ingredientId:
          type: string
        measure:
          type: string
          example: 200g
        ingredient:
          $ref: '#/components/schemas/Ingredient'
  _count:
    type: object
    required:
      - favorites
    properties:
      favorites:
        type: integer
        example: 5

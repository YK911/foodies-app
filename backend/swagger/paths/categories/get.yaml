# GET /api/categories (BE-05)
tags:
  - Categories
summary: Get all recipe categories
description: Public endpoint, no authorization required.
operationId: getCategories
security: []
responses:
  '200':
    description: Categories sorted by name
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/Category.yaml'
  '500':
    description: Internal Server Error

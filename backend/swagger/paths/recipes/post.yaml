# POST /api/recipes
tags:
  - Recipes
summary: Create a new recipe
description: Creates a new recipe for the authenticated user with an image uploaded via multipart/form-data.
operationId: createRecipe
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - title
          - description
          - category
          - area
          - time
          - instructions
          - ingredients
          - thumb
        properties:
          title:
            type: string
            minLength: 2
            maxLength: 120
            example: Ocean Pasta
          description:
            type: string
            maxLength: 200
            example: A light seafood pasta with tomatoes and herbs.
          category:
            type: string
            example: Seafood
          area:
            type: string
            example: Italian
          time:
            type: string
            description: Cooking time in minutes (>= 1)
            example: '27'
          instructions:
            type: string
            maxLength: 1000
            example: Boil pasta in salted water, sauté seafood, and combine with sauce.
          ingredients:
            type: string
            description: JSON-encoded array of objects with id and measure
            example: '[{"id":"640c2dd963a319ea671e365b","measure":"200g"}]'
          thumb:
            type: string
            format: binary
            description: Recipe photo (image file up to 5 MB)
responses:
  '201':
    description: Recipe successfully created
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/RecipeDetails.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '413':
    description: Uploaded image exceeds the 5 MB limit
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'

tags: [Users]
summary: List favorites for the specified profile
operationId: getProfileFavorites
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema: { type: string }
  - in: query
    name: page
    schema: { type: integer, minimum: 1, default: 1 }
  - in: query
    name: limit
    schema: { type: integer, minimum: 1, maximum: 50, default: 6 }
responses:
  '200':
    description: Paginated favorites
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ProfileRecipePage'
  '400':
    description: Invalid pagination
  '401':
    description: Unauthorized
  '404':
    description: Profile not found

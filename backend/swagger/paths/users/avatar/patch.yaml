tags: [Users]
summary: Update current user's avatar
description: Uploads a new avatar image to Cloudinary.
operationId: updateAvatar
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - avatar
        properties:
          avatar:
            type: string
            format: binary
            description: Avatar image (maximum 5 MB)
responses:
  '200':
    description: Avatar updated successfully
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UserSummary'
  '400':
    description: Invalid image file
  '413':
    description: Image exceeds the upload limit
  '502':
    description: Image storage provider rejected the upload
  '401':
    description: Unauthorized
  '500':
    description: Internal Server Error

tags: [Users]
summary: Get users followed by the current user
operationId: getFollowing
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
  - in: query
    name: limit
    schema:
      type: integer
      minimum: 1
      default: 6
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      default: 6
responses:
  '200':
    description: List of followed users
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PaginatedUsers'
  '401':
    description: Unauthorized
